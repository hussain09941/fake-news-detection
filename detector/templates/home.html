<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

```
<title>Fake News Detector</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #667eea, #764ba2);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 30px;
    }

    .container {
        background: white;
        width: 100%;
        max-width: 850px;
        padding: 35px;
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }

    h1 {
        text-align: center;
        margin-bottom: 10px;
    }

    .subtitle {
        text-align: center;
        color: #666;
        margin-bottom: 25px;
    }

    textarea {
        width: 100%;
        height: 280px;
        padding: 15px;
        font-size: 16px;
        border: 2px solid #ddd;
        border-radius: 10px;
        resize: vertical;
        outline: none;
    }

    textarea:focus {
        border-color: #667eea;
    }

    .buttons {
        display: flex;
        gap: 10px;
        margin-top: 15px;
        flex-wrap: wrap;
    }

    button {
        border: none;
        padding: 12px 22px;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
    }

    .check-btn {
        background: #667eea;
        color: white;
    }

    .check-btn:hover {
        background: #4f5fc4;
    }

    .clear-btn {
        background: #eee;
    }

    .example-btn {
        background: #f0f0f0;
        font-size: 14px;
    }

    .result {
        margin-top: 25px;
        padding: 20px;
        border-radius: 10px;
        text-align: center;
    }

    .fake {
        background: #ffe5e5;
        color: #b00020;
    }

    .real {
        background: #e5ffe9;
        color: #087f23;
    }

    .confidence {
        font-size: 18px;
        margin-top: 10px;
    }

    .examples {
        margin-top: 20px;
    }

    .examples h3 {
        margin-bottom: 10px;
    }

</style>
```

</head>

<body>

<div class="container">

```
<h1> Fake News Detector</h1>

<p class="subtitle">
    Paste a news article and let the AI model analyze it.
</p>

<form method="POST">

    {% csrf_token %}

    <textarea
        id="news"
        name="news"
        placeholder="Paste your news article here..."
        required>{{ request.POST.news }}</textarea>

    <div class="buttons">

        <button type="submit" class="check-btn">
            🔍 Check News
        </button>

        <button type="button" class="clear-btn" onclick="clearText()">
            🗑 Clear
        </button>

    </div>

</form>


<div class="examples">

    <h3>Try Sample Articles</h3>

    <button class="example-btn" onclick="fakeExample()">
         Fake Example
    </button>

    <button class="example-btn" onclick="realExample()">
         Real Example
    </button>

</div>


{% if prediction %}

    <div class="result {% if 'FAKE' in prediction %}fake{% else %}real{% endif %}">

        <h2>{{ prediction }}</h2>

        <div class="confidence">
            Model Confidence:
            <strong>{{ confidence|floatformat:2 }}%</strong>
        </div>

    </div>

{% endif %}
```

</div>

<script>

function clearText() {
    document.getElementById("news").value = "";
}


function fakeExample() {

    document.getElementById("news").value =
`BREAKING: Scientists have confirmed that drinking five cups of coffee every day can make humans live forever. Anonymous researchers claim that this discovery was hidden from the public for decades.`;

}


function realExample() {

    document.getElementById("news").value =
`Government officials held a meeting on Monday to discuss economic policies and plans for improving public infrastructure. Representatives said further details would be announced after discussions were completed.`;

}

</script>

</body>
</html>
